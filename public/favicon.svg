<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#06080f"/>

  <!-- French tricolor clipped to inner circle -->
  <clipPath id="clip">
    <circle cx="16" cy="16" r="13"/>
  </clipPath>
  <g clip-path="url(#clip)">
    <rect x="3"  y="3" width="8.67" height="26" fill="#002395"/>
    <rect x="11.67" y="3" width="8.66" height="26" fill="#F0F0F0"/>
    <rect x="20.33" y="3" width="8.67" height="26" fill="#ED2939"/>
  </g>

  <!-- Subtle ring border -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>

  <!-- "27" text centered, dark so it reads on the tricolor -->
  <text x="16" y="20" text-anchor="middle"
        font-family="Impact, Arial Black, sans-serif"
        font-size="10.5" font-weight="900"
        fill="#06080f" opacity="0.82"
        letter-spacing="-0.5">27</text>
</svg>
