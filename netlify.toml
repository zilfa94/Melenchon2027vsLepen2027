[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port    = 5173

# ── SPA routing ───────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security & performance headers ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Empêche le clickjacking
    X-Frame-Options = "DENY"

    # Empêche le MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Referrer minimal (vie privée + SEO)
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Désactive les capteurs / caméra / micro inutiles
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    # HSTS — 1 an, incluant sous-domaines
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy
    # - scripts : seulement self + Google Fonts
    # - styles  : self + Google Fonts (unsafe-inline requis par Tailwind JIT)
    # - images  : self + data URIs
    # - connexions : self + Supabase (pour la fonction vote via Netlify)
    # - frames  : aucun
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://iixfqqkyztpjjkanhjrb.supabase.co; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # Cross-Origin isolation légère
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-site"

# Assets statiques — cache long terme (hash dans le nom de fichier)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images — cache 7 jours
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Favicon / manifest — cache 1 jour
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/manifest+json"

# HTML — pas de cache (toujours frais)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# API vote — CORS + pas de cache
[[headers]]
  for = "/api/vote"
  [headers.values]
    Cache-Control = "no-store"
